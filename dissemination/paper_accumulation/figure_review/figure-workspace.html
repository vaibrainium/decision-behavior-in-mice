  <script>
  (() => {
    const root = document.getElementById('mouse-figure-review');
    const source = JSON.parse(root.querySelector('#mouse-figure-source').textContent);
    const select = root.querySelector('#mouse-figure-view');
    const img = root.querySelector('#mouse-figure-image');
    function draw() {
      const doc = new DOMParser().parseFromString(source, 'image/svg+xml');
      const svg = doc.documentElement;
      if (select.value === 'pulse') {
        const bounds = svg.getAttribute('viewBox').split(/\s+/).map(Number);
        const w = bounds[2], h = bounds[3];
        svg.setAttribute('viewBox', `${w*.54} ${h*.035} ${w*.46} ${h*.365}`);
        svg.setAttribute('width', String(w*.46));
        svg.setAttribute('height', String(h*.365));
        img.alt = 'Figure 1B: UCLA early and middle pulse schedules, UW early, middle and late schedules. Orange: Rightward pulse. Blue: Leftward pulse. Response registration begins at 0.3 seconds.';
      }
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(svg));
    }
    select.addEventListener('change', draw);
    draw();
  })();
  </script>
