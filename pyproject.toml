[project]
name = "src"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Vaibhav Thakur", email = "vaibhavt459@gmail.com"},]
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "ipykernel",
    "python-dotenv",
    "pathlib2",
    "pyyaml",
    "pandas",
    "polars",
    "scipy",
    "scikit-learn",
    "numba",
    "statsmodels",
    "matplotlib",
    "seaborn",
    "bokeh",
    "pyddm",
    "omegaconf>=2.3.0",
    "scienceplots>=2.1.1",
    "torch>=2.6.0",
    "opencv-python>=4.11.0.86",
    "ipywidgets>=8.1.5",
    "msgpack>=1.1.0",
    "numpy>=1.26.4",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [""]
include = ["*"]

[dependency-groups]
dev = [
    "pygame>=2.6.1",
]
